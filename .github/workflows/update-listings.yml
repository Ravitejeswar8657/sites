name: update-listings

# Listing pages (research/index.html, learning/index.html, plans/index.html) are generated —
# agents only add research/<slug>/, learning/<slug>/ or plans/<slug>/ dirs; this fills in the links.
on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'learning/**'
      - 'plans/**'
      - '!research/index.html'
      - '!learning/index.html'
      - '!plans/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 .github/scripts/update-listings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research learning plans
          git diff --cached --quiet || git commit -m "auto: regenerate listings"
          git push
